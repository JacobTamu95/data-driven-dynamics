# Grazer quad -- real flight system ID config.
#
# Vehicle constants taken from rotorpy config/grazer_generated.yaml.
# NOTE ON FRAMES: rotorpy stores rotor positions in a FLU body frame
# (x forward, y LEFT, z UP); this tool expects FRD (x forward, y RIGHT,
# z DOWN). Positions below are converted as (x, -y, -z).
#
# Motor mapping verified against the log's own CA_ROTOR* parameters:
#   CA_ROTOR0 (+0.15,+0.15) KM=+0.05 -> front right  == rotorpy r1
#   CA_ROTOR1 (-0.15,-0.15) KM=+0.05 -> back  left   == rotorpy r2
#   CA_ROTOR2 (+0.15,-0.15) KM=-0.05 -> front left   == rotorpy r3
#   CA_ROTOR3 (-0.15,+0.15) KM=-0.05 -> back  right  == rotorpy r4
# so actuator_motors.control[0..3] lines up with u0..u3 below.
#
# ARM LENGTH -- MEASURED 2026-09-30, RECTANGULAR X FRAME.
# Motor centers were measured as a rectangle, each motor identified by name,
# origin at the back left motor:
#     back left  (0,     0    )      back right (0.379, 0    )
#     front left (0,     0.315)      front right(0.379, 0.315)
# so the FIRST coordinate is the lateral axis and the SECOND is fore-aft.  The
# airframe is WIDER THAN IT IS LONG: 0.379 m left-to-right against 0.315 m
# front-to-back.  Halving each gives the position components
#     x (front<->back half-span) = 0.315 / 2 = 0.1575 m
#     y (left<->right half-span) = 0.379 / 2 = 0.1895 m
#     radial hub->motor          = sqrt(.1575^2 + .1895^2) = 0.24641 m
#
# The user's measurement frame maps onto FRD with NO sign flips: their first
# coordinate already increases to the right and their second increases forward.
#
# CG -- MEASURED 2026-09-30, relative to the ground under the back left motor,
# with z measured UPWARD:  CG = (0.1895, 0.1575, 0.1714) m, motor centers 6 in
# (0.1524 m) above the ground.
#
# In x and y the CG is EXACTLY the centre of the motor rectangle (offset 0.0 in
# both), so all four arms stay equal and there is no static CG trim moment.  The
# symmetric-rectangle model above is therefore correct, not merely assumed.
#
# In z, converting to FRD (positive DOWN) puts the CG at -0.1714 and the motors
# at -0.1524, so the rotor position relative to the CG is
#     z = -0.1524 - (-0.1714) = +0.019 m
# i.e. the rotors sit 19 mm BELOW the CG.  The previous -0.06 in this file had
# the sign backwards AND was 3x too large.  z does NOT affect c_m_leaver_quad
# (cross(r, [0,0,-1]) = (-r_y, r_x, 0), so z cancels), but it does enter the drag
# and rolling moments and the rotational airspeed v + omega x r.
#
# CAVEAT: 0.1524 m is the MOTOR CENTRE height; thrust acts at the PROP DISC,
# roughly 15-25 mm higher, which would put the thrust plane at ~0.172 m -- level
# with the CG, i.e. z ~ 0.  The true value is therefore somewhere in 0.000 to
# +0.019, and the whole offset is within its own uncertainty.  Sensitivity was
# checked and is negligible (see grazer_results/README.md).
#
# The lever vector is r x a_hat, which for a vertical rotor axis picks out the
# COMPONENTS -- roll arm = r_y, pitch arm = r_x.  The radial distance never
# appears.  Because the frame is RECTANGULAR the two arms genuinely differ by
# 20%, so a single shared value cannot represent both.  Here the ROLL arm is the
# long one (0.1895) and the PITCH arm the short one (0.1575).
#
# The old 0.175 in this file was neither: it is very nearly the AVERAGE of the
# two half-spans (0.1735).  Used as both components it happens to reproduce the
# correct radial magnitude to 0.4% -- which is why nothing caught it -- but it
# mis-splits that magnitude, running the roll arm 8% short and the pitch arm 11%
# long.  Averaging is only harmless when the two spans are equal.
#
# NB PX4's CA_ROTOR*_PX/PY = 0.15 on the board has the same defect and is
# additionally 5-21% short per axis, and rotorpy's gui/vehicles/grazer.yaml
# rotor_pos carries the old 0.175 components.  Both describe the wrong airframe.
#
# AXIS ASSIGNMENT COMES FROM THE MEASUREMENT, NOT FROM FIT QUALITY, and this
# airframe is the cautionary case: the measured geometry fits WORSE.  Swapping
# x and y gives moment R2 0.526 against 0.484 for the truth.  The reason is that
# one shared c_m_leaver_quad serves both the roll and the pitch equation, so the
# ratio r_y/r_x is the only freedom the optimizer has to reweight one axis
# against the other.  With a 3.7x unexplained deficit in that coefficient (see
# grazer_results/README.md) the arm ratio gets used as a nuisance parameter that
# absorbs part of it, and R2 rewards whichever ratio soaks up the most residual.
# Geometry is an INPUT here, measured with a tape.  Do not let the regression
# talk you out of it.
#
# PROP DIAMETER is deliberately left unset (defaults to 1.0 m), so the
# rho*D^4 / rho*D^5 scalings are absorbed into the identified coefficients.
# They remain valid for prediction but are NOT dimensionless prop
# coefficients. Set `diameter:` on each rotor to recover those.

model_name: "Grazer Quad"
model_type: "Standard Multirotor"
model_class: "MultiRotorModel"
extractor_class: "Not implemented"

extractor_config:
  "Not implemented"

  # all vectors in FRD body frame if not specified otherwise
model_config:
  # MEASURED 2026-08-25: bench-measured mass and calculated moments of inertia
  # for the real grazer airframe.  These SUPERSEDE the old nominal placeholders
  # (mass 2.0, Ixx=Iyy=0.0217, Izz=0.04) that were carried over from
  # rotorpy's config/grazer_generated.yaml -- those were symmetric round-number
  # estimates, not measurements.
  #
  # Sanity check: for a roughly planar mass distribution the perpendicular-axis
  # relation Izz ~= Ixx + Iyy should hold.  0.03407 vs 0.01813 + 0.02063 =
  # 0.03876, i.e. within ~12%, which is what you expect once the battery/stack
  # mass sitting off the rotor plane is accounted for.  Good consistency.
  #
  # NOTE: mass enters the FORCE fit linearly (identified thrust coefficients
  # scale directly with it) and inertia enters the MOMENT fit linearly, so the
  # 15% mass drop (2.0 -> 1.7) will shrink the identified thrust coefficients
  # by ~15% relative to the 2026-08-10 run.
  mass: 1.7
  moment_of_inertia:
    Ixx: 0.01813295223
    Iyy: 0.02062901673
    Izz: 0.03407476595
  actuators:
    rotors:
      vertical_:
        - rotor_0:
          description: "front right rotor"
          rotor_type: "RotorModel"
          dataframe_name: "u0"
          rotor_axis:
            - 0
            - 0
            - -1
          turning_direction: -1
          position:
            - 0.1575
            - 0.1895
            - 0.019

        - rotor_1:
          description: "back left rotor"
          rotor_type: "RotorModel"
          dataframe_name: "u1"
          rotor_axis:
            - 0
            - 0
            - -1
          turning_direction: -1
          position:
            - -0.1575
            - -0.1895
            - 0.019

        - rotor_2:
          description: "front left rotor"
          rotor_type: "RotorModel"
          dataframe_name: "u2"
          rotor_axis:
            - 0
            - 0
            - -1
          turning_direction: 1
          position:
            - 0.1575
            - -0.1895
            - 0.019

        - rotor_3:
          description: "back right rotor"
          rotor_type: "RotorModel"
          dataframe_name: "u3"
          rotor_axis:
            - 0
            - 0
            - -1
          turning_direction: 1
          position:
            - -0.1575
            - 0.1895
            - 0.019

dynamics_model_config:
  optimizer_config:
    optimizer_class: "QPOptimizer"
    optimzation_parameters:
    parameter_bounds:
      c_d_fuselage_x: !!python/tuple [0.0, 50.0]
      c_d_fuselage_y: !!python/tuple [0.0, 50.0]
      c_d_fuselage_z: !!python/tuple [0.0, 50.0]
      vertical_c_m_drag_z_lin: !!python/tuple [-1.0, 0.0]
      vertical_c_m_drag_z_quad: !!python/tuple [0.0, 2.0]
      vertical_c_m_leaver_lin: !!python/tuple [-1.0, 0.0]
      vertical_c_m_leaver_quad: !!python/tuple [0.0, 2.0]
      vertical_c_m_rolling: !!python/tuple [0.0, 2.0]
      vertical_rot_drag_lin: !!python/tuple [0.0, 2.0]
      vertical_rot_thrust_lin: !!python/tuple [-5.0, 0.0]
      vertical_rot_thrust_quad: !!python/tuple [0.0, 50.0]
  # actuator_motors/control[] is already normalized 0..1, so make the
  # PWM->normalized mapping a pass-through (the default assumes 0..2000 us).
  actuator_normalization:
    min_output: 0.0
    max_output: 1.0
    trim_output: 0.5
  estimate_forces: True
  estimate_moments: True
  resample_freq: 100.0
  estimate_angular_acceleration: True
  data:
    required_ulog_topics:
      # CRITICAL: actuator_motors, NOT actuator_outputs. On a real FC
      # actuator_outputs is PWM in microseconds (0..1999 in this log); the
      # rotor model requires inputs normalized to 0..1, which is what
      # actuator_motors/control[] carries.
      actuator_motors:
        ulog_name:
          - "timestamp"
          - "control[0]"
          - "control[1]"
          - "control[2]"
          - "control[3]"
        dataframe_name:
          - "timestamp"
          - "u0"
          - "u1"
          - "u2"
          - "u3"
        actuator_type:
          - "timestamp"
          - "motor"
          - "motor"
          - "motor"
          - "motor"
      vehicle_local_position:
        ulog_name:
          - "timestamp"
          - "vx"
          - "vy"
          - "vz"
      vehicle_attitude:
        ulog_name:
          - "timestamp"
          - "q[0]"
          - "q[1]"
          - "q[2]"
          - "q[3]"
        dataframe_name:
          - "timestamp"
          - "q0"
          - "q1"
          - "q2"
          - "q3"
      vehicle_angular_velocity:
        ulog_name:
          - "timestamp"
          - "xyz[0]"
          - "xyz[1]"
          - "xyz[2]"
        dataframe_name:
          - "timestamp"
          - "ang_vel_x"
          - "ang_vel_y"
          - "ang_vel_z"
      sensor_combined:
        ulog_name:
          - "timestamp"
          - "accelerometer_m_s2[0]"
          - "accelerometer_m_s2[1]"
          - "accelerometer_m_s2[2]"
          - "gyro_rad[0]"
          - "gyro_rad[1]"
          - "gyro_rad[2]"
        dataframe_name:
          - "timestamp"
          - "acc_b_x"
          - "acc_b_y"
          - "acc_b_z"
          - "ang_acc_b_x"
          - "ang_acc_b_y"
          - "ang_acc_b_z"
      vehicle_land_detected:
        ulog_name:
          - "timestamp"
          - "landed"
        dataframe_name:
          - "timestamp"
          - "landed"
